  <text x="108" y="211" font-size="11" fill="#2f6fd0" text-anchor="end" font-weight="700">the two rows</text>
  <text x="108" y="227" font-size="10" fill="#8b95a5" text-anchor="end">no routing fits here</text>

  <g stroke="#ccd3db" stroke-width="1" stroke-dasharray="3 3">
    <line x1="424" y1="96" x2="480" y2="96"></line><line x1="424" y1="324" x2="480" y2="324"></line>
