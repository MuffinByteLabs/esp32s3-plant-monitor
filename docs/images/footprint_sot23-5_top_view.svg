  <text x="116" y="368" font-size="10.5" fill="#8b95a5" text-anchor="end">= personal-space box</text>

  <rect x="200" y="170" width="194" height="80" fill="none" stroke="#9aa6b6" stroke-width="1.4"></rect>
  <text x="297" y="215" font-size="11.5" fill="#8b95a5" text-anchor="middle">part body</text>

  <rect x="170" y="96" width="70" height="62" rx="3" fill="#c07a3e"></rect>
  <rect x="354" y="96" width="70" height="62" rx="3" fill="#c07a3e"></rect>
