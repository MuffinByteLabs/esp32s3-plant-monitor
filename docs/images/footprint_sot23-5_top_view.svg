  <text x="486" y="222" font-size="10.5" fill="#8b95a5">outer edge to outer edge</text>

  <line x1="241" y1="293" x2="261" y2="293" stroke="#c2410c" stroke-width="1.8" marker-start="url(#arRS)" marker-end="url(#arR)"></line>
