  <rect x="354" y="262" width="70" height="62" rx="3" fill="#c07a3e"></rect>
  <text x="205" y="299" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">1</text>
  <text x="297" y="299" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">2</text>
  <text x="389" y="299" font-size="13" fill="#fff" text-anchor="middle" font-weight="700">3</text>

  <circle cx="160" cy="293" r="6.5" fill="#3c4654"></circle>
