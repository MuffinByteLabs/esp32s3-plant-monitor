    <line x1="170" y1="158" x2="114" y2="158"></line><line x1="170" y1="262" x2="114" y2="262"></line>
  </g>
  <line x1="120" y1="159" x2="120" y2="261" stroke="#2f6fd0" stroke-width="1.7" marker-start="url(#arS)" marker-end="url(#ar)"></line>
