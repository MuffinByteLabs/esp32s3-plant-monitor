<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-label="Top view of a five pad footprint showing pitch, gap and span"><rect x="0" y="0" width="760" height="400" fill="#ffffff"/>
  <rect x="148" y="74" width="298" height="272" fill="none" stroke="#b0b9c4" stroke-width="1.4" stroke-dasharray="6 4"></rect>
